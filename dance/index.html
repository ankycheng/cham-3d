<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Cham Dance — Cham Exhibition | Columbia × AMNH 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0e0e0e;
  --text: #f0ebe2;
  --text-dim: #8a8279;
  --gold: #b8924a;
  --t-serif: "EB Garamond", Georgia, "Times New Roman", serif;
  --t-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --ease-out: cubic-bezier(0.32, 0.72, 0, 1);
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--t-sans);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow: hidden;
}

/* ── Stage layout ── */
.stage {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  padding: 64px 24px 96px;
}
.player-wrap {
  position: relative;
  width: 100%;
  max-width: 1100px;
  background: #000;
  border-radius: 6px;
  overflow: hidden;
  box-shadow: 0 30px 80px rgba(0,0,0,0.6);
  line-height: 0;
}
.player-wrap video {
  display: block;
  width: 100%;
  height: auto;
  max-height: calc(100dvh - 200px);
  background: #000;
}

/* ── Top Bar ── */
.top-bar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 10;
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 20px;
  background: linear-gradient(to bottom, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.4) 60%, transparent 100%);
  pointer-events: none;
}
.top-bar > * { pointer-events: auto; }

.back-btn {
  display: inline-flex; align-items: center; gap: 8px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.18);
  color: var(--text);
  font-family: var(--t-sans); font-size: 13px; font-weight: 500;
  padding: 9px 16px; border-radius: 8px;
  cursor: pointer; text-decoration: none;
  transition: background 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
}
.back-btn:hover { background: rgba(255,255,255,0.16); border-color: rgba(255,255,255,0.32); }
.back-btn:active { transform: scale(0.97); }
.back-btn svg { width: 16px; height: 16px; flex-shrink: 0; }

.brand {
  font-family: var(--t-serif); font-size: 15px; font-style: italic;
  color: var(--text-dim); letter-spacing: 0.02em;
  white-space: nowrap;
}

/* ── Caption Bar ── */
.caption {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  padding: 24px 24px 22px;
  text-align: center;
  background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.5) 70%, transparent 100%);
  pointer-events: none;
}
.caption-inner {
  max-width: 720px; margin: 0 auto;
  pointer-events: auto;
}
.caption-title {
  font-family: var(--t-serif); font-size: clamp(18px, 3vw, 22px);
  font-weight: 500; letter-spacing: 0.01em; line-height: 1.3;
}
.caption-meta {
  font-size: 12px; color: var(--text-dim);
  letter-spacing: 0.04em; margin-top: 4px;
}

/* ── Responsive ── */
@media (max-width: 640px) {
  .stage { padding: 56px 12px 84px; }
  .back-btn { font-size: 12px; padding: 7px 12px; }
  .brand { display: none; }
  .caption { padding: 18px 16px 16px; }
  .caption-title { font-size: 15px; }
  .caption-meta { font-size: 11px; }
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}
.top-bar { animation: fadeUp 0.5s 0.15s ease both; }
.player-wrap { animation: fadeUp 0.6s 0.25s ease both; }
.caption { animation: fadeUp 0.5s 0.4s ease both; }
</style>
</head>
<body>

<div class="top-bar">
  <a class="back-btn" id="backBtn" href="https://archaeology.columbia.edu/cham/">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
    Back to Exhibition
  </a>
  <span class="brand">Cham — A Ritual in Motion</span>
</div>

<div class="stage">
  <div class="player-wrap">
    <video
      controls
      playsinline
      preload="metadata"
      title="Cham dance demonstration at the American Museum of Natural History">
      <source src="https://pub-2b051b2ba5f841ef9871dfc105bb26f6.r2.dev/cham-dance-amnh-gildercenter.mp4" type="video/mp4">
      Your browser cannot play this video. <a href="https://pub-2b051b2ba5f841ef9871dfc105bb26f6.r2.dev/cham-dance-amnh-gildercenter.mp4">Download the video</a> to watch it.
    </video>
  </div>
</div>

<div class="caption">
  <div class="caption-inner">
    <div class="caption-title">Cham Dance Demonstration</div>
    <div class="caption-meta">American Museum of Natural History · Gilder Center</div>
  </div>
</div>

<script>
  // Honor a `?return=` query so the back button can carry forward an anchor on /cham/
  (function () {
    const backBtn = document.getElementById('backBtn');
    const params = new URLSearchParams(location.search);
    const returnUrl = params.get('return');
    if (returnUrl && /^https?:\/\//.test(returnUrl)) backBtn.href = returnUrl;
  })();
</script>

</body>
</html>
